[tools]
sops = "3.13.3"
doggo = "1.4.2"
dyff = "1.12.0"
flux2 = "2.10.1"
helm = "4.3.2"
"npm:@immich/cli" = "3.4.2"
"github:ifd3f/caligula" = "0.5.0"

yamllint = "1.38.0"
jactionlint = "2.6.0"
python = "3.15.2"
uv = "0.13.10"
"github:home-operations/flate" = "0.8.0"

[env]
IMMICH_INSTANCE_URL = "https://immich.wallstreet30.cc/api"
DIFF="dyff between --omit-header --color on"

## templates

[task_templates."nix:build"]
run = "nix run nixpkgs#nixos-rebuild -- build --flake .#{{ vars.host }}"

[task_templates."nix:deploy"]
run = """
nix run nixpkgs#nixos-rebuild -- boot --sudo --impure --flake .#{{ vars.host }} --target-host clemens@{{ vars.ip }}
ssh clemens@{{ vars.ip }} -C sudo systemctl reboot
kubectl wait --for=condition=Ready node/{{ vars.host }} --timeout=10m
"""

[task_templates."nix:image"]
run = """
rm -rf ./result
nix run nixpkgs#nixos-rebuild -- build-image --image-variant iso --flake .#{{ vars.host }} --image-variant sd-card
image=$(find ./result/sd-image/ -name "*.zst")
caligula burn "$image"
"""

## flux

[tasks."flux:build"]
run = "flate build all --path ./flux"

[tasks."flux:diff"]
run = "flate diff all --path ./flux"

[tasks."flux:test"]
run = "flate test all --path ./flux"

## nix

[tasks."nix:check"]
run = """
nix flake check -L --no-build
"""

[tasks."nix:refresh-flake"]
run = """
nix run .#write-flake
"""

[tasks."nix:update-flake"]
run = """
rm -rf result current
nix run nixpkgs#nixos-rebuild -- build --flake .#hl-server --impure
mv result current
nix flake update --commit-lock-file --option commit-lockfile-summary "chore(flake): update flake.lock"
nix run nixpkgs#nixos-rebuild -- build --flake .#hl-server --impure
nix run nixpkgs#dix -- diff current result
"""

## hosts

### hl-server

[tasks."hl-server:build"]
extends = "nix:build"
vars = { host = "hl-server" }

[tasks."hl-server:deploy"]
extends = "nix:deploy"
depends = ["hl-server:build"]
vars = { host = "hl-server", ip = "192.168.178.100" }

### hl-agent-00

[tasks."hl-agent-00:build"]
extends = "nix:build"
vars = { host = "hl-agent-00" }

[tasks."hl-agent-00:deploy"]
extends = "nix:deploy"
depends = ["hl-agent-00:build"]
vars = { host = "hl-agent-00", ip = "192.168.178.101" }

[tasks."hl-agent-00:image"]
extends = "nix:image"
depends = ["hl-agent-00:build"]
vars = { host = "hl-agent-00" }

### hl-agent-01

[tasks."hl-agent-01:build"]
extends = "nix:build"
vars = { host = "hl-agent-01" }

[tasks."hl-agent-01:deploy"]
extends = "nix:deploy"
depends = ["hl-agent-01:build"]
vars = { host = "hl-agent-01", ip = "192.168.178.102" }

[tasks."hl-agent-01:image"]
extends = "nix:image"
depends = ["hl-agent-01:build"]
vars = { host = "hl-agent-01" }

## other tasks

[tasks."upgrade"]
run = """
kubectl scale -n media deployments.apps -l requires-nfs=true --replicas 0 || :
mise r nix:update-flake
mise r hl-server:deploy
mise r hl-agent-00:build
mise r hl-agent-00:deploy
mise r hl-agent-01:deploy
kubectl wait --for=condition=Ready node --all --timeout=10m
kubectl scale -n media deployments.apps -l requires-nfs=true --replicas 1 || :
mise r cleanup-pods
git push
"""

[tasks."cleanup-pods"]
run = """
kubectl delete pods --field-selector=status.phase==Succeeded -A
kubectl delete pods --field-selector=status.phase==Failed -A
"""

[tasks."create-logo"]
run = """
nix build --impure --expr '(builtins.getFlake "github:lunik1/nix-wallpaper").packages.${builtins.currentSystem}.default.override { width = 500; height = 500; logoSize = 80; backgroundColor = "#326ce5"; logoColors = {color0 = "#ffffff"; color1 = "#ffffff"; color2 = "#ffffff"; color3 = "#ffffff"; color4 = "#ffffff"; color5 = "#ffffff";}; }'
cp ./result/share/wallpapers/nixos-wallpaper.png ./logo.png
"""

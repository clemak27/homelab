[tools]
sops = "3.13.3"
doggo = "1.4.2"
dyff = "1.12.0"
flux2 = "2.10.0"
helm = "4.3.2"
"npm:@immich/cli" = "3.4.2"
"github:ifd3f/caligula" = "0.5.0"

yamllint = "1.38.0"
jactionlint = "2.6.0"
python = "3.15.2"
uv = "0.13.9"
"github:home-operations/flate" = "0.8.0"

[env]
IMMICH_INSTANCE_URL = "https://immich.wallstreet30.cc/api"
DIFF="dyff between --omit-header --color on"

## templates

[task_templates."nix:build"]
run = "nix run nixpkgs#nixos-rebuild -- build --flake .#{{ vars.host }}"

[task_templates."nix:deploy"]
run = """
nix run nixpkgs#nixos-rebuild -- boot --sudo --impure --flake .#{{ vars.host }} --target-host clemens@{{ vars.ip }}
sleep 5
ssh clemens@{{ vars.ip }} -C sudo systemctl reboot
"""

## flux

[tasks."flux:build"]
run = "flate build all --path ./flux"

[tasks."flux:diff"]
run = "flate diff all --path ./flux"

[tasks."flux:test"]
run = "flate test all --path ./flux"

## nix

[tasks."nix:check"]
run = """
nix flake check -L --no-build
"""

[tasks."nix:refresh-flake"]
run = """
nix run .#write-flake
"""

[tasks."nix:update-flake"]
run = """
rm -rf result current
nix run nixpkgs#nixos-rebuild -- build --flake .#hl-server --impure
mv result current
nix flake update --commit-lock-file --option commit-lockfile-summary "chore(flake): update flake.lock"
nix run nixpkgs#nixos-rebuild -- build --flake .#hl-server --impure
nix run nixpkgs#dix -- diff current result
"""

## hosts

[tasks."all:build"]
run = """
mise run hl-server:build
mise run hl-agent-00:build
mise run hl-agent-01:build
"""

[tasks."hl-server:build"]
extends = "nix:build"
vars = { host = "hl-server" }

[tasks."hl-server:deploy"]
depends = ["hl-server:build"]
run = """
user="clemens"
ip="192.168.178.100"
host="hl-server"

kubectl scale -n media deployments.apps -l requires-nfs=true --replicas 0 || :
sleep 30

nix run nixpkgs#nixos-rebuild -- boot --sudo --impure --flake .#$host --target-host $user@$ip
sleep 5
ssh $user@$ip -C sudo systemctl reboot
sleep 120

while ! ssh $user@$ip -C exit 0 &> /dev/null; do sleep 5; done;
sleep 30

kubectl scale -n media deployments.apps -l requires-nfs=true --replicas 1 || :
"""

[tasks."hl-agent-00:build"]
extends = "nix:build"
vars = { host = "hl-agent-00" }

[tasks."hl-agent-00:deploy"]
extends = "nix:deploy"
depends = ["hl-agent-00:build"]
vars = { host = "hl-agent-00", ip = "192.168.178.101" }

[tasks."hl-agent-01:build"]
extends = "nix:build"
vars = { host = "hl-agent-01" }

[tasks."hl-agent-01:deploy"]
extends = "nix:deploy"
depends = ["hl-agent-01:build"]
vars = { host = "hl-agent-01", ip = "192.168.178.102" }

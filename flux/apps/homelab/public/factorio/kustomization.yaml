---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: public
resources:
  - dns.yaml
  - factorio-server-settings.enc.yaml
  - release.yaml
configMapGenerator:
  - name: factorio-values
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
    files:
      - values.yaml=values.yaml

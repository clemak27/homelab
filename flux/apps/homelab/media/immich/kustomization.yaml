---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - database.yaml
  - immich-ml.yaml
  - release.yaml
  - valkey.yaml
configMapGenerator:
  - name: immich-values
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
    files:
      - values.yaml=values.yaml

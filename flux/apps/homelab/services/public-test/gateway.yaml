---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-test
  namespace: services
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  gatewayClassName: traefik
  listeners:
    - hostname: &host public-test.wallstreet30.cc
      name: public-test-http
      port: 80
      protocol: HTTP
    - hostname: *host
      name: public-test-https
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
          - group: ""
            kind: Secret
            name: public-test-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-test
  namespace: services
spec:
  hostnames:
    - public-test.wallstreet30.cc
  parentRefs:
    - name: traefik
  rules:
    - backendRefs:
        - name: public-test
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-test-redirect
spec:
  parentRefs:
    - name: public-test
      sectionName: http
  hostnames:
    - public-test.wallstreet30.cc
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443

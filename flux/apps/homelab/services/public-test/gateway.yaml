---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: public-test
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    external-dns.kubernetes.io/target: wallstreet30.cc
spec:
  parentRef:
    name: traefik-gateway
    namespace: kube-system
    kind: Gateway
    group: gateway.networking.k8s.io
  listeners:
    - name: public-test
      hostname: public-test.wallstreet30.cc
      protocol: HTTPS
      port: 8443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: public-test-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-test
  namespace: services
spec:
  hostnames:
    - public-test.wallstreet30.cc
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  rules:
    - backendRefs:
        - name: public-test
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /

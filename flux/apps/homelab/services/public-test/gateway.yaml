---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-test
  namespace: services
spec:
  hostnames:
    - public-test.wallstreet30.cc
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
  rules:
    - backendRefs:
        - name: public-test
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /

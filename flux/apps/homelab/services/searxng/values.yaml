---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/values.schema.json
controllers:
  main:
    initContainers:
      wait-for-valkey:
        image:
          repository: nixery.dev/shell/busybox/redis
          tag: latest
        args:
          - bash
          - -c
          - "set -x; while [[ ! \"$(redis-cli -h searxng-valkey.services ping | grep PONG)\" ]]; do sleep 5; done"
    containers:
      searxng:
        image:
          repository: docker.io/searxng/searxng
          tag: latest
        env:
          TZ: Europe/Vienna
          SEARXNG_SETTINGS_PATH: /config/settings.yaml
          SEARXNG_SECRET:
            valueFrom:
              secretKeyRef:
                name: searxng-secret
                key: secret_key

configMaps:
  searxng-config:
    forceRename: searxng-config
    enabled: true
    data:
      settings.yaml: |
        use_default_settings: true
        search:
          safe_search: 0
          autocomplete: "duckduckgo"
          favicon_resolver: "duckduckgo"
          default_lang: "auto"
          languages:
            - all
            - en
            - de
          formats:
            - html
            - json
        server:
          base_url: "https://searxng.wallstreet30.cc"
        valkey:
          url: valkey://searxng-valkey.services
        ui:
          default_theme: simple
          theme_args:
            simple_style: black
        categories_as_tabs:
          general:
          images:
          videos:

persistence:
  config:
    enabled: true
    type: configMap
    name: searxng-config
    globalMounts:
      - path: config
        readOnly: true

service:
  main:
    type: ClusterIP
    controller: main
    ports:
      http:
        port: 8080

ingress:
  main:
    enabled: true
    className: traefik
    annotations:
      ingress.kubernetes.io/ssl-redirect: "true"
      cert-manager.io/cluster-issuer: letsencrypt-production
    hosts:
      - host: searxng.wallstreet30.cc
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http
    tls:
      - hosts:
          - searxng.wallstreet30.cc
        secretName: searxng-tls

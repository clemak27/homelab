---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo-runner
spec:
  chart:
    spec:
      chart: forgejo-runner
      version: 13.1.0
      sourceRef:
        kind: HelmRepository
        name: forgejo-runner
      interval: 50m
  interval: 30m
  # https://git.erwanleboucher.dev/eleboucher/runner-k8s-plugin/src/branch/main/charts/forgejo-runner
  values:
    forgejo:
      url: "http://forgejo-http:3000"
      existingSecret: forgejo-runner-secret
    image:
      repository: data.forgejo.org/forgejo/runner
      tag: "13.2.0"
    runnerConfig: |-
      cache:
        enabled: true
        dir: /data/cache
      container:
        docker_host: "-"
      kubernetes:
        namespace: services
        poll_timeout: 30m
      log:
        level: info
      plugins:
        k8s:
          address: "unix:///plugin/forgejo-runner-k8s.sock"
          options:
            namespace: services
            poll_timeout: 10m
            labels: "app.kubernetes.io/name=forgejo-runner-instance"
            resources: |
              requests:
                memory: 256Mi
              limits:
                memory: 256Mi
      runner:
        capacity: 4
        file: /persistent/.runner
        labels:
          - default:k8s:/config/podspec-default.yaml
          - large:k8s:/config/podspec-large.yaml
          - xl:k8s:/config/podspec-xl.yaml
          - buildah:k8s:/config/podspec-buildah.yaml
        timeout: 1h
        shutdown_timeout: 3m
    podSpecs:
      podspec-default.yaml: |-
        containers:
          - name: main
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04
            env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
            resources:
              requests:
                memory: 512Mi
              limits:
                memory: 512Mi
                ephemeral-storage: 5Gi
        restartPolicy: Never
        nodeSelector:
          node-role.kubernetes.io/worker: worker
        tolerations:
          - effect: NoSchedule
            key: node-type
            operator: Equal
            value: agent
      podspec-large.yaml: |-
        containers:
          - name: main
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04
            env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
            resources:
              requests:
                memory: 2Gi
              limits:
                memory: 2Gi
                ephemeral-storage: 5Gi
        restartPolicy: Never
        nodeSelector:
          node-role.kubernetes.io/worker: worker
        tolerations:
          - effect: NoSchedule
            key: node-type
            operator: Equal
            value: agent
      podspec-xl.yaml: |-
        containers:
          - name: main
            image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04
            env:
              - name: DEBIAN_FRONTEND
                value: noninteractive
            resources:
              requests:
                memory: 4Gi
              limits:
                memory: 4Gi
                ephemeral-storage: 5Gi
        restartPolicy: Never
        nodeSelector:
          node-role.kubernetes.io/worker: worker
        tolerations:
          - effect: NoSchedule
            key: node-type
            operator: Equal
            value: agent
      podspec-buildah.yaml: |-
        hostUsers: false
        containers:
          - name: main
            image: docker.io/ppaslan/forgejo-buildah:v1.43.1-2
            env:
              - name: BUILDAH_ISOLATION
                value: chroot
              - name: STORAGE_DRIVER
                value: overlay
              - name: TAR_OPTIONS
                value: "--no-same-permissions --no-same-owner"
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              allowPrivilegeEscalation: false
              # readOnlyRootFilesystem: true
              # capabilities:
              #   add:
              #     - SETUID
              #     - SETGID
              #     - SYS_CHROOT
              #     - SETFCAP
              #     - CHOWN
              #   drop:
              #     - ALL
              # seccompProfile:
              #   type: Localhost
              #   localhostProfile: profiles/ci-build.json
            volumeMounts:
              - name: buildah-storage
                mountPath: /var/lib/containers/storage
              - name: tmp
                mountPath: /tmp
              - name: var-tmp
                mountPath: /var/tmp
              - name: run
                mountPath: /run
            resources:
              requests:
                memory: 4Gi
              limits:
                memory: 4Gi
                ephemeral-storage: 10Gi
        restartPolicy: Never
        volumes:
          - name: buildah-storage
            emptyDir:
              sizeLimit: 10Gi
          - name: tmp
            emptyDir:
              sizeLimit: 1Gi
          - name: var-tmp
            emptyDir:
              sizeLimit: 1Gi
          - name: run
            emptyDir:
              sizeLimit: 256Mi

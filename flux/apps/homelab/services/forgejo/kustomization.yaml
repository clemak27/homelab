---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: services
resources:
  - database.yaml
  - forgejo-admin.enc.yaml
  - forgejo-runner-secret.enc.yaml
  - release.yaml
  - runner.yaml
configMapGenerator:
  - name: forgejo-values
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
    files:
      - values.yaml=values.yaml
